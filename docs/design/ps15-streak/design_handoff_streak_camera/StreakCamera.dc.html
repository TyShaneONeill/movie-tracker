class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'active';

      milestone: {body:'#f59e0b',bodySh:'#d97706',reelA:'#fbbf24',reelB:'#d97706',reelIn:'#241703',holes:'#fde68a',lens:'#b45309',face:'#fef3c7',dotc:'#fde68a',mount:'#fde68a',ring:'#fbbf24',spark:'#fde68a',glowCore:'#ffffff',glowHalo:'#ffe58f',beamA:'rgba(255,224,138,.6)',beamB:'rgba(255,224,138,.16)',glowOp:1,celebr:1,camGlow:'drop-shadow(0 6px 26px rgba(251,191,36,.35))'}
    };
    const p = palettes[state] || palettes.active;
    const on = beam && state !== 'idle' ? 1 : 0;
    const vars = `--body:${p.body};--bodySh:${p.bodySh};--reelA:${p.reelA};--reelB:${p.reelB};--reelIn:${p.reelIn};--holes:${p.holes};--lens:${p.lens};--face:${p.face};--dotc:${p.dotc};--mount:${p.mount};--ring:${p.ring};--spark:${p.spark};--glowCore:${p.glowCore};--glowHalo:${p.glowHalo};--beamA:${p.beamA};--beamB:${p.beamB};--glowOp:${p.glowOp};--celebr:${p.celebr};--beamOp:${on};--camGlow:${p.camGlow}`;
    return {vars, isReel: variant === 'reel', isProj: variant === 'projector', isHead: variant === 'reelhead'};
  }
}
</script>
